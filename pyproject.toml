[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-audit"
version = "1.0.0a5"
description = "Agent-agnostic engineering assurance for Git-based software changes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CORA contributors"}]
keywords = ["software-assurance", "ai-assisted-development", "git", "engineering-evidence"]
dependencies = []

[project.scripts]
cora = "cora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cora = ["portable_js_imports.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
