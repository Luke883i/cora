name: CI | CORA canonical reticular convergence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  convergent-unit:
    name: convergent-unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: SHA-bound candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install same candidate source
        run: python -m pip install -e .
      - name: Canonical kernel and contextual regression
        run: |
          python -m unittest discover -s tests -p 'test_pr20_*.py' -v
          python -m unittest discover -s tests -p 'test_pr17_*.py' -q
          python -m unittest discover -s tests -p 'test_pr18_*.py' -q
          python -m unittest discover -s tests -p 'test_pr19_*.py' -q
      - name: Product repository and roles invariants
        run: |
          python tools/verify_repository_contract.py --repo .
          python tools/verify_artifact_roles.py --repo .
      - name: Complete R1-R4 AND cuts cannot self-authorize
        run: |
          cora convergence-plan --output /tmp/reticular-complete.json
          python -c 'import json; p=json.load(open("/tmp/reticular-complete.json")); assert p["goal"]=="G_R1_R4_COMPLETE" and len(p["source_locals"])==10 and len(p["external_locals"])==9 and p["authorization"]=="NONE"'
      - name: Frozen Git and ontology contextual pre/postmerge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_INTENT: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cora dev-premerge . --base "$BASE_SHA" --head "$HEAD_SHA" --contextual --intent "$CHANGE_INTENT" --output /tmp/cora-context.json
          else
            cora dev-postmerge . --previous "$BASE_SHA" --head "$HEAD_SHA" --contextual --intent "$CHANGE_INTENT" --output /tmp/cora-context.json
          fi
          cora verify-contextual-gate /tmp/cora-context.json --repo . --intent "$CHANGE_INTENT"
          python -c 'import json; p=json.load(open("/tmp/cora-context.json")); assert p["head_commit"] and p["authorization"]=="NONE" and p["status"]=="SOURCE_OBSERVED_REVIEW_REQUIRED" and p["continuous_gate"]["base_policy_digest"] and p["candidate_graph_source"] and p["graph_problem"] is None and p["intent_status"]=="CALLER_SUPPLIED_UNVERIFIED_BOUND_TO_BASE_HEAD" and p["intent_digest"] and p["canonical_lattice"]["complete_dod"]=="BLOCKED_EXTERNAL" and p["external_approval"]=="BLOCKED_EXTERNAL" and p["mutations"]=="NOT_EXECUTED" and p["contract_authority"]=="PR_EDITABLE_PROFILE_NOT_BASE_HOST_AUTHORITY"'
  convergent-model-10m:
    name: convergent-model-10m-twice
    needs: [convergent-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: SHA-bound candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - run: python -m pip install -e .
      - name: Preseeded ten million finite fault classes
        run: cora stress-convergence --require-full --output /tmp/convergence-10m-a.json
      - name: Full duplicate seeded replay
        run: |
          cora stress-convergence --require-full --output /tmp/convergence-10m-b.json
          cmp /tmp/convergence-10m-a.json /tmp/convergence-10m-b.json
      - name: Falsify unsafe promotion and evidence-denominator laundering
        run: |
          python -c 'import json; r=json.load(open("/tmp/convergence-10m-a.json")); assert r["status"]=="PASS_SCOPED_FINITE_MODEL" and r["cases"]==10000000 and r["sessions"]==10 and len(r["families"])==16 and r["model_mismatches"]==0 and r["unsafe_promotions"]==0 and r["source_mutants_executed"]==0 and r["complete_R1_R4"]=="BLOCKED_EXTERNAL" and len(r["receipts"])==10 and all(x["observed_singles"]==16 and x["observed_pairs"]==120 and x["normalized_signatures"]==2517 and x["new_signatures_tail"]==0 for x in r["receipts"])'
      - name: Preserve scoped model receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr20-10m-finite-model-no-real-source-mutants
          path: |
            /tmp/convergence-10m-a.json
            /tmp/convergence-10m-b.json
          if-no-files-found: warn
          retention-days: 14
