name: AOSP R2 — 100 bounded editorial mutations
on:
  pull_request:
    paths:
      - 'research/decision-ready-assurance/aosp-r2/**'
      - '.github/workflows/ci-aosp-r2-editorial.yml'
  push:
    branches: [main]
    paths:
      - 'research/decision-ready-assurance/aosp-r2/**'
      - '.github/workflows/ci-aosp-r2-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay 100 physical copied mutations and Word identity
        run: |
          python3 research/decision-ready-assurance/aosp-r2/tools/replay_100.py --out r2-replay.json
      - name: Retain bounded mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-r2-editorial-replay
          path: r2-replay.json
          if-no-files-found: warn
          retention-days: 7
