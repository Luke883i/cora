name: CI | CORA release source readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install candidate and run independent negative release oracles
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p 'test_pr15_release_readiness.py' -v
      - name: Verify source contracts, not external approval
        run: |
          python tools/verify_repository_contract.py --repo .
          python tools/verify_release_readiness.py --repo . --output /tmp/release-source.json
          python -c 'import json; r=json.load(open("/tmp/release-source.json")); assert r["source_status"]=="PASS_SCOPED" and r["release_status"]=="BLOCKED_EXTERNAL" and r["authorization"]=="NONE" and not r["release_authorized"]'
      - name: Probe actual GitHub branch enforcement and unpublished tag (read-only)
        # Never pass even a read-only private-repository token to PR-supplied code.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORA_REPO: ${{ github.repository }}
        run: |
          python tools/verify_release_readiness.py --repo . --observe-host --host-repository "$CORA_REPO" --host-commit "$(git rev-parse HEAD)" --host-tag v1.0.0a4 --host-output /tmp/cora-pr32-host.json --output /tmp/cora-pr32-source.json
          python -c 'import json; a=json.load(open("/tmp/cora-pr32-host.json")); assert a["schema"]=="cora-host-release-dossier/1" and a["host"]["provenance"].startswith("AUTHENTICATED_READ_ONLY_") and a["external_gate"]=="BLOCKED_EXTERNAL" and a["authorization"]=="NONE" and a["release_authorized"] is False'
      - name: Preserve time-sensitive host-state observations for human review
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr32-host-readonly-${{ matrix.python-version }}
          path: |
            /tmp/cora-pr32-host.json
            /tmp/cora-pr32-source.json
          if-no-files-found: warn
          retention-days: 14
      - name: CORA-on-CORA source replay
        run: |
          python tools/verify_artifact_roles.py --repo . --output /tmp/roles.json
          cora process-run . --process full --revision HEAD --max-commits 12 --focus src/cora/continuous.py --output /tmp/process.json
          cora verify-process /tmp/process.json --repo .
          cora debt-scan . --max-commits 12 --output /tmp/debt.json
          cora verify-debt /tmp/debt.json --repo .

  final-experimental-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact candidate revision and build-only install
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install .
      - name: Independently replay source chronology and physical Git behavior
        run: |
          python -m unittest discover -s tests -p 'test_pr41_final_experimental.py' -v
          python tools/verify_documentation.py --repo .
          python tools/verify_capability_atlas.py --repo .
          python tools/verify_final_experimental.py --repo . --revision HEAD --run-behavior --output /tmp/pr41-final-source.json
          python tools/verify_final_experimental.py --repo . --revision HEAD --verify-report /tmp/pr41-final-source.json --output /tmp/pr41-final-replay.json
          python - <<'PY'
          import json, subprocess
          r=json.load(open('/tmp/pr41-final-source.json'))
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['commit']==sha and r['counts']['cli']==71
          assert r['counts']['markdown']==48
          assert r['behavior']['fixture_repositories']==2
          assert r['behavior']['execution']=='ACTUAL_CORA_CLI_AND_NATIVE_GIT_EXECUTED'
          assert r['product_status']=='BLOCKED_EXTERNAL'
          assert r['host_enforcement']=='BLOCKED_EXTERNAL'
          assert r['public_release']=='NOT_AUTHORIZED'
          assert not r['release_authorized'] and not r['tag_authorized']
          PY
      - name: Retain Git-scoped source/physical behavior receipts, not human approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr41-final-source-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            /tmp/pr41-final-source.json
            /tmp/pr41-final-replay.json
          if-no-files-found: warn
          retention-days: 30

  final-experimental-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute and replay exact million preseeded semantic fault vectors
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install .
          python tools/verify_final_experimental.py --repo . --revision HEAD --stress-1m --output /tmp/pr41-final-1m.json
          python tools/verify_final_experimental.py --repo . --revision HEAD --verify-report /tmp/pr41-final-1m.json --output /tmp/pr41-final-1m-replay.json
          python - <<'PY'
          import json,subprocess
          r=json.load(open('/tmp/pr41-final-1m.json'))
          assert r['commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['cases']==1000000 and r['sessions']==4 and r['fault_families']==16
          assert r['preregistered_masks']==2517
          assert r['distinct_finite_masks']>=2517
          assert r['mismatches']==0 and r['unsafe_authorizations']==0
          assert r['real_git_mutants']==0 and not r['release_authorized']
          assert r['external_gates']=='BLOCKED_EXTERNAL'
          assert r['status']=='PASS_BOUNDED_FINITE_MODEL'
          PY
      - name: Retain reproducible bounded fault stream for independent comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr41-1m-finite-${{ github.sha }}
          path: |
            /tmp/pr41-final-1m.json
            /tmp/pr41-final-1m-replay.json
          if-no-files-found: warn
          retention-days: 30
