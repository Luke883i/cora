name: CI | PR16 semantic assurance lattice
concurrency:
  group: cora-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
  push:
    branches: [main, feat/pr-16-semantic-assurance-lattice]
permissions:
  contents: read
jobs:
  semantic-lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR default is an ephemeral merge commit; our evidence is for the actual head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact candidate HEAD (not an implicit PR merge commit)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Independent public guide and sixty physical source-copy falsifiers (source only)
        run: python research/decision-ready-assurance/public-field-guide/verify_public_guide.py
      - name: Rebuild exact standalone Word and reject sixty OOXML counterexamples (author scoped)
        run: |
          python -m pip install 'python-docx==1.2.0'
          python research/decision-ready-assurance/public-field-guide/build_guide.py
          python research/decision-ready-assurance/public-field-guide/audit_guide.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('research/decision-ready-assurance/public-field-guide')
          doc=root/'From_Intent_to_Evidence.docx'
          report=json.loads((root/'Editorial_Falsification_Report.json').read_text())
          assert report['negative_physical_docx_copies']==60 and report['negative_detected']==60
          assert report['distinct_negative_docx_digests']==60
          assert report['benign_metadata_controls']==10 and report['benign_accepted']==10
          assert report['docx_sha256']==hashlib.sha256(doc.read_bytes()).hexdigest()
          assert report['docx_sha256']=='d0c7d4c827a0f03874dea3479e15ebc650f9408c1295110ec97df49b93c2a19f'
          assert report['target_runtime'] if 'target_runtime' in report else report['not_claimed']
          PY
      - name: R5 original Git source register and eight typed negative oracles (source only)
        run: python research/decision-ready-assurance/aosp-r5/verify_incremental_r5.py
      - name: R3 exact-Git Word plus 100 physical editorial mutants (source scoped)
        run: |
          python research/decision-ready-assurance/aosp-r3/tools/falsify_r3_100.py --output /tmp/cora-r3-100.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cora-r3-100.json'))
          assert r['baseline_git_blob']=='1c7be2ed38a9f106708468be29bc703e9a5cd9d9'
          assert r['mutants']==100 and r['detected']==100
          assert r['distinct_mutated_git_blobs']==100 and not r['survivors']
          assert r['benign_controls']==10 and r['benign_accepted']==10
          assert r['runtime_product_test']=='NOT_DONE' and r['external_human_test']=='NOT_DONE'
          PY
      - name: R2 original-source editorial comparator (100 finite copies; no product claim)
        run: |
          python research/decision-ready-assurance/aosp-r2/tools/replay_100.py --out /tmp/cora-r2-100.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cora-r2-100.json'))
          assert r['mutants']==100 and r['detected']==100 and not r['survivors']
          assert r['benign_controls']==10 and r['benign_accepted']==10
          assert r['document_git_blob_sha']=='ffa99d46c315258f3dc7cb8067e039b7c3ce3741'
          assert r['scope']=='AUTHOR_SCOPED_NOT_PEER_REVIEW'
          PY
      - name: Install candidate and scoped coverage oracle
        run: |
          # PR07 nested wheel/sdist oracle imports setuptools.build_meta in
          # a fresh interpreter; Python 3.13 does not bundle setuptools.
          python -m pip install 'setuptools>=77' 'wheel>=0.45'
          python -m pip install -e .
          python -m pip install 'coverage==7.10.7'
      - name: C5 source, ontology, roles and replay
        run: |
          python tools/verify_repository_contract.py --repo . | tee /tmp/cora-repo-contract.json
          python tools/verify_artifact_roles.py --repo . --output /tmp/cora-roles.json
          cora artifact-audit . --revision HEAD --output /tmp/cora-artifacts.json
          cora verify-artifacts /tmp/cora-artifacts.json --repo .
          cora snapshot . --revision HEAD --output /tmp/cora-snapshot.json
          cora verify-ledger /tmp/cora-snapshot.json --repo .
      - name: PR33 original Git fixture metrics and negative-contract regressions
        run: |
          python -m unittest discover -s tests -p 'test_pr33_ci_repro.py' -q
          python -m cora.ci_repro --repo . --sha "$(git rev-parse HEAD)" --repetitions 3 --output /tmp/cora-pr33-measured.json
          python -c 'import json; a=json.load(open("/tmp/cora-pr33-measured.json")); assert a["sample_total"]==6 and a["failures_total"]==0 and a["postmerge_status"]=="BLOCKED_EXTERNAL" and a["root_cause"]=="NOT_ATTESTED" and a["authorization"]=="NONE"'
      - name: C6-C7 full unit regression with measured branch coverage
        run: coverage run --branch --source=src/cora -m unittest discover -s tests -q
      - name: Reproduce PR25 original-Git physical mutants three times (no retry masking)
        run: |
          for attempt in 1 2 3; do
            echo "PR25 original-Git test attempt $attempt / 3, exact HEAD $(git rev-parse HEAD), tree $(git rev-parse HEAD^{tree})"
            python -m unittest discover -s tests -p test_pr25_method_synthesis.py -q
          done
      - name: Replay PR25 Git falsifiers on exact pre-PR main commit (not a synthetic tree)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          original=$(mktemp -d)
          git worktree add --detach "$original" "$BASE_SHA"
          trap 'git worktree remove --force "$original"' EXIT
          echo "Original integrated-main commit: $(git -C "$original" rev-parse HEAD)"
          echo "Original integrated-main tree: $(git -C "$original" rev-parse HEAD^{tree})"
          echo "Proposed source tree: $(git rev-parse HEAD^{tree})"
          for attempt in 1 2 3; do
            echo "MAIN ORIGINAL PR25 physical Git repeat $attempt/3"
            (cd "$original" && PYTHONPATH="$original/src" python -m unittest discover -s tests -p test_pr25_method_synthesis.py -q)
          done
      - name: C8 independent critical coverage floor
        run: |
          coverage json -o /tmp/cora-coverage.json
          python tools/verify_pr16_coverage.py /tmp/cora-coverage.json --output /tmp/cora-coverage-floor.json
      - name: C8 independent Git performance oracle
        run: |
          python tools/benchmark_pr16_git_batch.py --files 160 --output /tmp/cora-git-benchmark.json
          python -c 'import json; x=json.load(open("/tmp/cora-git-benchmark.json")); assert x["status"]=="PASS_SCOPED" and x["oracle_matches_batch"] and x["batch_git_subprocesses"]<=5'
      - name: C7 real-CLI ZIP to lattice source-only replay
        run: |
          python -c 'import zipfile; z=zipfile.ZipFile("/tmp/cora-pr16-fixture.zip","w"); z.writestr("source/sample.py","pass\n"); z.close()'
          cora zip-intake /tmp/cora-pr16-fixture.zip --output /tmp/cora-zip.json
          cora verify-zip-intake /tmp/cora-zip.json --archive /tmp/cora-pr16-fixture.zip
          cora lattice-audit /tmp/cora-pr16-fixture.zip --zip-report /tmp/cora-zip.json --output /tmp/cora-lattice.json
          cora verify-lattice /tmp/cora-lattice.json --archive /tmp/cora-pr16-fixture.zip --zip-report /tmp/cora-zip.json
          python -c 'import json; x=json.load(open("/tmp/cora-lattice.json")); assert x["authorization"]=="NONE" and x["governed_DoD"]=="BLOCKED_EXTERNAL" and x["nodes"][1]["status"]=="NOT_OBSERVED"'
      - name: Rebuild byte-pinned observer paper and replay 147 Word / 10k model faults
        shell: bash
        run: |
          set -euo pipefail
          root="research/decision-ready-assurance/observer-compiler-paper"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python -m pip install 'python-docx==1.2.0' 'Pillow==12.3.0'
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp "$root/Research_Source_And_Verification.zip" "$work/src.zip"
          git show "c331ea2ecad080083f61f221f4991b4030a74b8c:$root/From_Intent_to_Evidence.docx" > "$work/published.docx"
          (cd "$work" && unzip -q src.zip)
          (cd "$work" && python build_paper.py && python science_and_falsification.py && python audit_paper.py)
          cmp "$work/From_Intent_to_Evidence.docx" "$work/published.docx"
          python - "$work" "$root" <<'PY'
          import hashlib, json, pathlib, sys
          tmp, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          data = (tmp/'published.docx').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '75a5cfd30a3281877d21e0278aa9f5853eab9beb3639d1b83b85a1bdd5c68ef2'
          a=json.loads((tmp/'Document_Adversarial_Audit.json').read_text())
          s=json.loads((tmp/'Scientific_Challenge_Audit.json').read_text())
          assert a['status']=='PASS_AUTHOR_SCOPED' and a['physical_modified_Word_variants']==147
          assert a['physical_negative_detected']==147 and a['benign_accepted']==10
          assert s['model_variants_constructed']==10000 and s['detected_by_typed_oracle']==10000
          assert s['benign_accepted']==10 and s['original_bryophyte_empirical_validation']=='NOT_DONE'
          assert a['original_repo_runtime']=='NOT_RERUN' and a['human_test']=='NOT_PERFORMED'
          print('paper exact Word + source-only adversarial suites PASS_AUTHOR_SCOPED')
          PY
      - name: Rebuild scientific paper and falsify 162 physical DOCX faults on exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          root="research/decision-ready-assurance/observer-compiler-paper"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p /tmp/cora-paper-science
          unzip -oq "$root/Scientific_Editorial_Source_And_Audit.zip" -d /tmp/cora-paper-science
          (cd /tmp/cora-paper-science && python polish_paper.py && python audit_paper.py > /tmp/cora-science-audit-stdout.json)
          cmp /tmp/cora-paper-science/From_Intent_to_Evidence.docx "$root/From_Intent_to_Evidence.docx"
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research/decision-ready-assurance/observer-compiler-paper')
          work=pathlib.Path('/tmp/cora-paper-science')
          word=(root/'From_Intent_to_Evidence.docx').read_bytes()
          assert hashlib.sha256(word).hexdigest() == '988b8df4d4e90b172c17d5fe199b3818360d32a883b7320ff1c80135cb7cabf0'
          audit=json.loads((work/'Paper_Adversarial_Audit.json').read_text())
          dod=json.loads((root/'Scientific_Editorial_DoD.json').read_text())
          assert audit['negative_physical_docx_mutations']==162 and audit['negatives_rejected']==162
          assert audit['benign_physical_docx_mutations']==10 and audit['benign_accepted']==10
          assert audit['original_git_witnesses']==138 and audit['new_git_commit_file_oid_pins']==18
          assert audit['survivors']==[] and audit['false_positives']==[]
          assert audit['independent_review']=='NOT_ATTESTED' and audit['product_runtimes']=='NOT_EXECUTED'
          assert dod['logic']=='NON_COMPENSATORY_AND' and dod['authority']=='NONE'
          assert all(x['status']=='BLOCKED_EXTERNAL' for x in dod['nodes'] if x['id'].startswith('E'))
          assert dod['word_git_blob']=='77fc302848772c4d34b8c0b60df932f1f9703f48'
          print('SCIENTIFIC_PAPER_PASS_AUTHOR_SCOPED_NOT_PUBLICATION_GRADE')
          PY
      - name: Archive evidence with explicit limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr16-python-${{ matrix.python-version }}-source-evidence-only
          path: |
            research/decision-ready-assurance/public-field-guide/From_Intent_to_Evidence.docx
            /tmp/cora-repo-contract.json
            /tmp/cora-roles.json
            /tmp/cora-artifacts.json
            /tmp/cora-snapshot.json
            /tmp/cora-pr33-measured.json
            /tmp/cora-coverage.json
            /tmp/cora-coverage-floor.json
            /tmp/cora-git-benchmark.json
            /tmp/cora-zip.json
            /tmp/cora-lattice.json
          if-no-files-found: warn
          retention-days: 14
  diagnostic-unit-discovery:
    needs: [semantic-lattice]
    if: ${{ failure() && needs.semantic-lattice.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      headline: ${{ steps.extract.outputs.headline }}
      test_status: ${{ steps.extract.outputs.test_status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exactly the primary semantic-lattice Python 3.11 environment
        run: |
          python -m pip install 'setuptools>=77' 'wheel>=0.45'
          python -m pip install -e .
          python -m pip install 'coverage==7.10.7'
      - id: extract
        name: Reproduce and classify full unit regression without credentials
        shell: bash
        run: |
          set +e
          coverage run --branch --source=src/cora -m unittest discover -s tests -q > /tmp/cora-unit-diagnostic.txt 2>&1
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            echo "::error::Python 3.11 exact-environment unit regression failed (exit $result)."
            tail -n 90 /tmp/cora-unit-diagnostic.txt
          fi
          if [[ "$result" -ne 0 ]]; then
            reason=$(grep -E '^(fatal:|error:|.*Error:|.*Exception:|.*OSError:|.*RuntimeError:)' /tmp/cora-unit-diagnostic.txt | tail -n 1 | tr -d '\r' | cut -c 1-130 || true)
            headline="cause:${reason:-unclassified}; "
          else
            headline=""
          fi
          headline="${headline}$(grep -E '^(ERROR: |FAIL: |FAILED|Ran [0-9]+ tests)' /tmp/cora-unit-diagnostic.txt | head -n 2 | tr '\n' '_' | cut -c 1-110 || true)"
          headline=$(printf '%s' "$headline" | tr -cd '[:print:]' | cut -c 1-190)
          if [[ -z "$headline" ]]; then headline="no-standard-unittest-error-line"; fi
          echo "headline=$headline" >> "$GITHUB_OUTPUT"
          echo "test_status=$result" >> "$GITHUB_OUTPUT"
      - name: Retain Python 3.11 raw diagnostic trace for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr32-diagnostic-311-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/cora-unit-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
  diagnostic-unit-visible:
    needs: [diagnostic-unit-discovery]
    name: "${{ format('Diagnostic unit [{0}]: {1}', needs.diagnostic-unit-discovery.outputs.test_status, needs.diagnostic-unit-discovery.outputs.headline) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Keep untrusted test failure visible without promoting PASS
        env:
          TEST_STATUS: ${{ needs.diagnostic-unit-discovery.outputs.test_status }}
        run: test "$TEST_STATUS" -eq 0

  diagnostic-unit-discovery-313:
    needs: [semantic-lattice]
    if: ${{ failure() && needs.semantic-lattice.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      headline: ${{ steps.extract.outputs.headline }}
      test_status: ${{ steps.extract.outputs.test_status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install exactly the PR16 semantic test environment
        run: |
          # PR07 nested wheel/sdist oracle imports setuptools.build_meta in
          # a fresh interpreter; Python 3.13 does not bundle setuptools.
          python -m pip install 'setuptools>=77' 'wheel>=0.45'
          python -m pip install -e .
          python -m pip install 'coverage==7.10.7'
      - id: extract
        name: Capture diagnostic summary for Python 3.13 without marking failure PASS
        shell: bash
        run: |
          set +e
          coverage run --branch --source=src/cora -m unittest discover -s tests -q > /tmp/cora-unit-diagnostic-313.txt 2>&1
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            echo "::error::Python 3.13 exact-environment unit regression failed (exit $result)."
            tail -n 90 /tmp/cora-unit-diagnostic-313.txt
          fi
          if [[ "$result" -ne 0 ]]; then
            reason=$(grep -E '^(fatal:|error:|.*Error:|.*Exception:|.*OSError:|.*RuntimeError:)' /tmp/cora-unit-diagnostic-313.txt | tail -n 1 | tr -d '\r' | cut -c 1-130 || true)
            headline="cause:${reason:-unclassified}; "
          else
            headline=""
          fi
          headline="${headline}$(grep -E '^(ERROR: |FAIL: |FAILED|Ran [0-9]+ tests)' /tmp/cora-unit-diagnostic-313.txt | head -n 2 | tr '\n' '_' | cut -c 1-110 || true)"
          headline=$(printf '%s' "$headline" | tr -cd '[:print:]' | cut -c 1-190)
          if [[ -z "$headline" ]]; then headline="no-standard-unittest-error-line"; fi
          echo "headline=$headline" >> "$GITHUB_OUTPUT"
          echo "test_status=$result" >> "$GITHUB_OUTPUT"
      - name: Retain Python 3.13 raw diagnostic trace for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr32-diagnostic-313-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/cora-unit-diagnostic-313.txt
          if-no-files-found: warn
          retention-days: 14
  diagnostic-unit-visible-313:
    needs: [diagnostic-unit-discovery-313]
    name: "${{ format('Diagnostic Python 3.13 [{0}]: {1}', needs.diagnostic-unit-discovery-313.outputs.test_status, needs.diagnostic-unit-discovery-313.outputs.headline) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Preserve failure as failure
        env:
          TEST_STATUS: ${{ needs.diagnostic-unit-discovery-313.outputs.test_status }}
        run: test "$TEST_STATUS" -eq 0
