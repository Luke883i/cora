name: CI | CORA engineering debt and process contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debt-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CORA and run adversarial Git fixtures
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p 'test_pr13*.py' -v
          python tools/verify_repository_contract.py --repo .
      - name: Run CORA on itself and revalidate every receipt
        run: |
          cora debt-scan . --revision HEAD --max-commits 12 --output /tmp/debt.json
          cora verify-debt /tmp/debt.json --repo .
          cora process-run . --revision HEAD --process full --max-commits 12 --focus src/cora/debt.py --output /tmp/full.json
          cora verify-process /tmp/full.json --repo .
          python -c 'import json; d=json.load(open("/tmp/full.json")); assert d["status"]=="PASS_SCOPED_WITH_UNVERIFIED_GAPS" and d["authorized_action"]=="NONE" and any(x["method"]=="debt_signals" for x in d["results"])'
      - name: PR40 Git-bound static/dynamic knowledge and physical mutant witnesses
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest discover -s tests -p 'test_pr40_engineering_closure.py' -v
          python tools/verify_engineering_closure.py --repo . --revision HEAD --output /tmp/ekc-source.json
          python tools/verify_engineering_closure.py --repo . --verify-report /tmp/ekc-source.json --output /tmp/ekc-replay.json
          python tools/verify_capability_atlas.py --repo .
          python - <<'PY'
          import json
          x=json.load(open('/tmp/ekc-source.json'))
          assert x['counts']['cli']==71 and x['authority']=='NONE'
          assert x['host_enforcement']=='BLOCKED_EXTERNAL'
          assert x['dynamic_execution']=='NOT_EXECUTED_BY_STATIC_AUDIT'
          assert not x['product_qualified']
          PY
      - name: Exact-PR-ancestry obligation delta and bounded replay (NOT external closure)
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$CANDIDATE_BASE"
          BASE_SHA="$(git merge-base "$CANDIDATE_BASE" HEAD)"
          test -n "$BASE_SHA" && test "$BASE_SHA" != "$(git rev-parse HEAD)"
          python tools/verify_engineering_closure.py --repo . --closure-base "$BASE_SHA" --revision HEAD --output /tmp/cora-pr43-obligations.json
          python tools/verify_engineering_closure.py --repo . --verify-closure /tmp/cora-pr43-obligations.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cora-pr43-obligations.json'))
          assert x['status']=='PASS_SCOPED_ACCOUNTING'
          assert x['counts']['verified_closures']==0 and x['counts']['closure_yield'] is None
          assert x['product']=='BLOCKED_EXTERNAL' and x['authority']=='NONE'
          PY
      - name: Separate native-Git source challenge (PR39 tests already in One-Run CI)
        run: |
          python tools/independent_git_oracle.py --repo . --closure-report /tmp/cora-pr43-obligations.json --reader-brief /tmp/cora-reader-brief.md --output /tmp/cora-native-challenge.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('/tmp/cora-native-challenge.json'))
          assert x['status']=='MATCHED_NATIVE_GIT_SOURCE_ONLY'
          assert x['operator_independence']=='NOT_ATTESTED'
          assert x['product']=='BLOCKED_EXTERNAL' and x['authority']=='NONE'
          guide=Path('/tmp/cora-reader-brief.md').read_text('utf-8')
          assert all(v in guide for v in ('Task 1','Task 2','Task 3','BLOCKED_EXTERNAL'))
          PY
      - name: Seeded one-million contract falsification, double replay
        run: |
          cora stress-debt --seed 883 --cases 1000000 --output /tmp/stress-1.json
          cora stress-debt --seed 883 --cases 1000000 --output /tmp/stress-2.json
          cmp /tmp/stress-1.json /tmp/stress-2.json
          python -c 'import json; x=json.load(open("/tmp/stress-1.json")); assert x["cases"]==1000000 and x["distinct_input_masks"]==1000000 and x["semantic_output_signatures"]==120 and x["mismatches"]==0 and x["stream_sha256"]=="2f105a47627564711abb3a3426d23242aaaa32415e9a46d65d221aff9dd2caf5"'

  knowledge-10m:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: PR40 exact HEAD original Git and full 10x1M seeded finite semantic falsifiers
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python tools/verify_engineering_closure.py --repo . --revision HEAD --stress-10m --output /tmp/cora-pr40-10m.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cora-pr40-10m.json'))
          m=r['finite_model']
          assert m['cases']==10000000 and m['sessions']==10
          assert m['status']=='PASS_SCOPED_FINITE_MODEL'
          assert m['preregistered_masks']==1471 and m['mismatches']==0
          assert m['unsafe_promotions']==0 and m['real_git_mutants']==0
          assert r['host_enforcement']=='BLOCKED_EXTERNAL' and r['authority']=='NONE'
          PY
      - name: Retain semantic-stream digests and unresolved source/external debt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cora-pr40-seeded-knowledge-source-${{ github.sha }}
          path: /tmp/cora-pr40-10m.json
          if-no-files-found: warn
          retention-days: 14
