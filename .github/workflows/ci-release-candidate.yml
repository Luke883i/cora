name: CI | CORA release candidate verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact release candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD^{tree}
      - name: Install build backend only
        run: python -m pip install 'setuptools>=77' 'wheel>=0.45'
      - name: Install CORA candidate entrypoints for source-bound preflight
        run: python -m pip install -e .
      - name: Resolve version from canonical package metadata
        run: echo "CORA_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"
      - name: Test real altered distribution archives
        run: |
          python -m unittest discover -s tests -p test_pr07.py -v
      - name: Build two independent local release candidates
        run: |
          python tools/build_candidate.py --source . --outdir dist/
          python tools/build_candidate.py --source . --outdir dist-repeat/
          cmp dist/cora_audit-$CORA_VERSION-py3-none-any.whl dist-repeat/cora_audit-$CORA_VERSION-py3-none-any.whl
          cmp dist/cora_audit-$CORA_VERSION.tar.gz dist-repeat/cora_audit-$CORA_VERSION.tar.gz
      - name: Verify source/wheel/sdist parity and archive safety
        run: |
          python tools/release_verify.py --source . --wheel dist/cora_audit-$CORA_VERSION-py3-none-any.whl --sdist dist/cora_audit-$CORA_VERSION.tar.gz --output dist/release-verification.json
      - name: Install wheel and sdist in separate offline-index environments
        run: |
          python tools/external_validate.py --wheel dist/cora_audit-$CORA_VERSION-py3-none-any.whl --sdist dist/cora_audit-$CORA_VERSION.tar.gz --output dist/external-validation.json
      - name: Materialize bounded exact Git candidate receipt and review-only release checklist
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/verify_release_readiness.py --repo . --output dist/release-source.json \
            --candidate-sha "$EXPECTED_SHA" \
            --candidate-wheel dist/cora_audit-$CORA_VERSION-py3-none-any.whl \
            --candidate-sdist dist/cora_audit-$CORA_VERSION.tar.gz \
            --candidate-verification dist/release-verification.json \
            --candidate-external dist/external-validation.json \
            --candidate-output dist/candidate-receipt.json
          sha256sum dist/cora_audit-$CORA_VERSION-py3-none-any.whl dist/cora_audit-$CORA_VERSION.tar.gz > dist/SHA256SUMS
          python -c 'import json; p=json.load(open("dist/candidate-receipt.json")); assert p["source_commit"]=="'${EXPECTED_SHA}'" and p["external_gate"]=="BLOCKED_EXTERNAL" and p["authorization"]=="NONE" and p["publication_authorized"] is False and p["signed_provenance"]=="NOT_ATTESTED"'
          printf 'CORA %s (alpha) — REVIEW CANDIDATE ONLY\nExact commit: %s\nUnsigned, unpublished; not approved for release.\nRequired before publish: green final main CI; independently authenticated reviewer and release manager; protected main and required checks; independently verified artifact provenance, real pilot and rollback.\n' "$CORA_VERSION" "$EXPECTED_SHA" > dist/RELEASE_NOTES_REVIEW.txt
          grep -Fx "CORA $CORA_VERSION (alpha) — REVIEW CANDIDATE ONLY" dist/RELEASE_NOTES_REVIEW.txt
          grep -Fx "Exact commit: $EXPECTED_SHA" dist/RELEASE_NOTES_REVIEW.txt
      - name: PR55 generate and replay real wheel/sdist CycloneDX, scoped SCA and unsigned provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          pins={"schema":"cora-build-tool-pins/1",
                "scope":"INSTALLED_BUILD_RUNNER_VERSIONS",
                "setuptools":version("setuptools"),"wheel":version("wheel")}
          Path("dist/build-tool-pins.json").write_text(json.dumps(pins,sort_keys=True)+"\n")
          Path("dist/build-tool-scannable.txt").write_text(
              "".join(k+"=="+pins[k]+"\n" for k in ("setuptools","wheel")))
          PY
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --version | grep -F '2.10.1'
          set +e
          python -m pip_audit -r dist/build-tool-scannable.txt --no-deps --disable-pip \
            --format=json --output=dist/pip-audit-raw.json
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -gt 1 ]; then
            echo "pip-audit feed/tool error is not a clean SCA result" >&2
            exit 2
          fi
          python tools/release_verify.py --source . \
            --wheel dist/cora_audit-$CORA_VERSION-py3-none-any.whl \
            --sdist dist/cora_audit-$CORA_VERSION.tar.gz \
            --git-commit "$EXPECTED_SHA" \
            --review-note dist/RELEASE_NOTES_REVIEW.txt \
            --build-pins dist/build-tool-pins.json \
            --sbom-output dist/cora.cdx.json \
            --provenance-output dist/cora-unsigned-build.json \
            --sca-raw dist/pip-audit-raw.json --sca-exit "$AUDIT_EXIT" \
            --sca-output dist/cora-scoped-sca.json \
            --output dist/supply-chain-source.json
          python tools/release_verify.py --source . \
            --wheel dist/cora_audit-$CORA_VERSION-py3-none-any.whl \
            --sdist dist/cora_audit-$CORA_VERSION.tar.gz \
            --git-commit "$EXPECTED_SHA" \
            --review-note dist/RELEASE_NOTES_REVIEW.txt \
            --build-pins dist/build-tool-pins.json \
            --verify-sbom dist/cora.cdx.json \
            --verify-provenance dist/cora-unsigned-build.json \
            --sca-raw dist/pip-audit-raw.json --sca-exit "$AUDIT_EXIT" \
            --verify-sca dist/cora-scoped-sca.json \
            --output dist/supply-chain-replay.json
          python - <<'PY'
          import json
          a=json.load(open("dist/supply-chain-source.json"))
          b=json.load(open("dist/supply-chain-replay.json"))
          assert a==b and a["supply_chain_bom"]["standard"]=="CycloneDX 1.6"
          assert a["build_observation"]["signature"]=="NONE"
          assert a["build_observation"]["slsa"]=="NOT_ATTESTED"
          assert a["sca"]["scope"]=="DIRECT_INSTALLED_CI_BUILD_TOOLS_ONLY"
          assert a["sca"]["external_authorization"]=="NONE"
          assert a["status"]=="VERIFIED_SCOPED"
          PY
      - name: PR55 falsify physical artifact SBOM and scoped scanner evidence
        run: |
          python -m unittest discover -s tests -p 'test_pr07.py' -v
          python -m unittest discover -s tests -p 'test_pr15_release_readiness.py' -v
      - name: Falsify one million release-risk states twice
        run: |
          python tools/release_stress.py --seed 883 --cases 1000000 --output dist/stress-a.json
          python tools/release_stress.py --seed 883 --cases 1000000 --output dist/stress-b.json
          cmp dist/stress-a.json dist/stress-b.json
          python -c 'import json; x=json.load(open("dist/stress-a.json")); assert x["mismatches"]==0 and x["distinct_risk_vectors"]==1000000 and x["families"]==24 and x["stream_sha256"]=="7038de9caeb53ac2449c5259319aa29e3d82938fdc3d2184d924fe29b0d982a8"'
      - name: Create unpublished v1 experimental review bundle
        run: |
          python tools/make_experimental_bundle.py --source . --dist dist --output dist/cora-v1-experimental-review.zip
      - name: Upload pre-release candidate artifacts for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-v1-experimental-python-${{ matrix.python-version }}-${{ github.event.pull_request.head.sha || github.sha }}-unpublished
          path: |
            dist/cora_audit-$CORA_VERSION-py3-none-any.whl
            dist/cora_audit-$CORA_VERSION.tar.gz
            dist/*validation.json
            dist/*verification.json
            dist/stress-a.json
            dist/SHA256SUMS
            dist/candidate-receipt.json
            dist/release-source.json
            dist/RELEASE_NOTES_REVIEW.txt
            dist/cora.cdx.json
            dist/cora-unsigned-build.json
            dist/cora-scoped-sca.json
            dist/pip-audit-raw.json
            dist/build-tool-pins.json
            dist/build-tool-scannable.txt
            dist/supply-chain-source.json
            dist/supply-chain-replay.json
            dist/cora-v1-experimental-review.zip
          if-no-files-found: error
          retention-days: 7
