name: CI | CORA release candidate verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend only
        run: python -m pip install 'setuptools>=77' 'wheel>=0.45'
      - name: Test real altered distribution archives
        run: |
          python -m unittest discover -s tests -p test_pr07.py -v
      - name: Build two independent local release candidates
        run: |
          python tools/build_candidate.py --source . --outdir dist/
          python tools/build_candidate.py --source . --outdir dist-repeat/
          cmp dist/cora_audit-0.7.0a1-py3-none-any.whl dist-repeat/cora_audit-0.7.0a1-py3-none-any.whl
          cmp dist/cora_audit-0.7.0a1.tar.gz dist-repeat/cora_audit-0.7.0a1.tar.gz
      - name: Verify source/wheel/sdist parity and archive safety
        run: |
          python tools/release_verify.py --source . --wheel dist/cora_audit-0.7.0a1-py3-none-any.whl --sdist dist/cora_audit-0.7.0a1.tar.gz --output dist/release-verification.json
      - name: Install wheel and sdist in separate offline-index environments
        run: |
          python tools/external_validate.py --wheel dist/cora_audit-0.7.0a1-py3-none-any.whl --sdist dist/cora_audit-0.7.0a1.tar.gz --output dist/external-validation.json
      - name: Falsify one million release-risk states twice
        run: |
          python tools/release_stress.py --seed 883 --cases 1000000 --output dist/stress-a.json
          python tools/release_stress.py --seed 883 --cases 1000000 --output dist/stress-b.json
          cmp dist/stress-a.json dist/stress-b.json
          python -c 'import json; x=json.load(open("dist/stress-a.json")); assert x["mismatches"]==0 and x["distinct_risk_vectors"]==1000000 and x["families"]==24 and x["stream_sha256"]=="7038de9caeb53ac2449c5259319aa29e3d82938fdc3d2184d924fe29b0d982a8"'
      - name: Upload pre-release candidate artifacts for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr07-python-${{ matrix.python-version }}-unpublished
          path: |
            dist/cora_audit-0.7.0a1-py3-none-any.whl
            dist/cora_audit-0.7.0a1.tar.gz
            dist/*validation.json
            dist/*verification.json
            dist/stress-a.json
          if-no-files-found: error
          retention-days: 7
