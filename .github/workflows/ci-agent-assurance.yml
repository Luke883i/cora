name: CI | CORA agent assurance
on:
  pull_request:
  push:
    branches: [main, feat/pr-17-ai-agent-retrograde-assurance]
permissions:
  contents: read
jobs:
  agent-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_pr17_*.py' -v
      - run: python tools/verify_repository_contract.py --repo .
      - run: python tools/verify_artifact_roles.py --repo .
      - run: cora stress-agent-dod --require-full
