name: CI | CORA agent assurance
on:
  pull_request:
  push:
    branches: [main, feat/pr-17-ai-agent-retrograde-assurance]
permissions:
  contents: read
jobs:
  agent-model:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_pr17_*.py' -v
      - run: python tools/verify_repository_contract.py --repo .
      - run: python tools/verify_artifact_roles.py --repo .
      - run: cora stress-agent-dod --require-full --output /tmp/cora-10m-a.json
      - run: cora stress-agent-dod --require-full --output /tmp/cora-10m-b.json
      - run: cmp /tmp/cora-10m-a.json /tmp/cora-10m-b.json
