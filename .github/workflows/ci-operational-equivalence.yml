name: CI | CORA finite operational equivalence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: operational-equivalence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-operational-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and run finite-universe adversarial cases
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install .
          python -m unittest discover -s tests -p 'test_pr70_operational_equivalence.py' -v
      - name: Execute exact-base/head native operational observations and independent replay
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$CANDIDATE_BASE"
          BASE_SHA="$(git merge-base "$CANDIDATE_BASE" HEAD)"
          test -n "$BASE_SHA"
          test "$BASE_SHA" != "$(git rev-parse HEAD)"
          python tools/verify_operational_equivalence.py --repo . --base "$BASE_SHA" --head HEAD \
            --execute-pinned-native --output /tmp/cora-operational-universe.json
          python tools/verify_operational_equivalence.py --repo . \
            --verify-report /tmp/cora-operational-universe.json --execute-pinned-native \
            --output /tmp/cora-operational-replay.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cora-operational-universe.json'))
          replay=json.load(open('/tmp/cora-operational-replay.json'))
          assert r['denominator']==77 and r['observed']==77 and r['passed']==77
          assert r['failed']==[] and len(r['rows'])==77
          assert r['status']=='PASS_EXHAUSTIVE_FINITE_OBSERVATIONS'
          assert r['product_global_status']=='BLOCKED_EXTERNAL'
          assert r['independent_reviewer']=='NOT_ATTESTED'
          assert r['authorization']=='NONE'
          assert replay['status']=='REPLAYED_SCOPED_OPERATIONS'
          assert replay['scoped_global_dod']=='PASS_ON_COMPLETE_REGISTERED_UNIVERSE'
          assert replay['product_global_status']=='BLOCKED_EXTERNAL'
          PY
      - name: Retain exact-revision finite operational receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-operational-universe-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            /tmp/cora-operational-universe.json
            /tmp/cora-operational-replay.json
          if-no-files-found: warn
          retention-days: 14

  legacy-regression-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      headline: ${{ steps.check.outputs.headline }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install original regression environment
        run: |
          python -m pip install -e .
          python -m pip install 'coverage==7.10.7'
      - id: check
        name: Reproduce exact-head legacy failures and extract bounded failure signatures
        shell: bash
        run: |
          set +e
          findings=""
          for name in repo roles atlas docs pr33 pr41; do
            case "$name" in
              repo) cmd=(python tools/verify_repository_contract.py --repo .) ;;
              roles) cmd=(python tools/verify_artifact_roles.py --repo .) ;;
              atlas) cmd=(python tools/verify_capability_atlas.py --repo .) ;;
              docs) cmd=(python tools/verify_documentation.py --repo .) ;;
              pr33) cmd=(python -m unittest discover -s tests -p test_pr33_ci_repro.py -q) ;;
              pr41) cmd=(python -m unittest discover -s tests -p test_pr41_final_experimental.py -q) ;;
            esac
            "${cmd[@]}" > "/tmp/cora-legacy-$name.txt" 2>&1
            status=$?
            if [[ "$status" -ne 0 ]]; then
              echo "::error title=Legacy-regression-$name::exit $status"
              tail -n 25 "/tmp/cora-legacy-$name.txt"
              line=$(grep -E '^(AssertionError|ValueError|TypeError|RuntimeError|ModuleNotFoundError|ERROR:|FAIL:|FAILED|CORA self-audit:)' "/tmp/cora-legacy-$name.txt" | tail -n 1 | cut -c 1-70 || true)
              line=$(printf '%s' "${line:-unclassified}" | tr -cs 'A-Za-z0-9_-.' '_' | cut -c 1-68)
              findings="${findings}${name}_${status}_${line}__"
            fi
          done
          if [[ -z "$findings" ]]; then findings="all_6_legacy_probes_success"; fi
          echo "headline=$(printf '%s' "$findings" | cut -c 1-230)" >> "$GITHUB_OUTPUT"
      - name: Preserve source-level regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-pr70-legacy-diagnostic-${{ github.sha }}
          path: /tmp/cora-legacy-*.txt
          if-no-files-found: warn
          retention-days: 7
  legacy-regression-visible:
    needs: [legacy-regression-diagnostic]
    name: "Legacy diagnostic: ${{ needs.legacy-regression-diagnostic.outputs.headline }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Bounded diagnostic only; original failing CI checks remain authoritative.'
