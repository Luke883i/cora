name: CI | CORA continuous development controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  premerge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CORA and test source-bound lifecycle contracts
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p 'test_continuous_pr14.py' -q
          python tools/verify_repository_contract.py --repo .
          python tools/verify_artifact_roles.py --repo .
      - name: Source-only CI workflow discovery and physical regression
        run: |
          python -m unittest discover -s tests -p 'test_pr24_workflow_rationalization.py' -v
          cora workflow-audit . --revision HEAD --output /tmp/cora-workflow-plan.json
          cora verify-workflows /tmp/cora-workflow-plan.json --repo .
          python -c 'import json; p=json.load(open("/tmp/cora-workflow-plan.json")); assert p["workflow_count"]>=12 and p["authorization"]=="NONE" and p["governed_status"]=="BLOCKED_EXTERNAL" and all(not x["retirement_authorized"] for x in p["workflows"])'
      - name: Synthesize existing method receipts and adversarial source cases
        run: |
          python -m unittest discover -s tests -p 'test_pr25_method_synthesis.py' -v
          cora method-synthesize . --revision HEAD --output /tmp/cora-method-case.json --analyst-request /tmp/cora-method-questions.json
          cora verify-method-synthesis /tmp/cora-method-case.json --repo .
          python -c 'import json; x=json.load(open("/tmp/cora-method-case.json")); assert x["reference_count"]==9 and x["procedure_count"]==14 and x["governed_model"]=="BLOCKED_EXTERNAL" and x["authorization"]=="NONE"'
      - name: Inspect PR merge revision against exact base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cora dev-premerge . --base "$BASE_SHA" --head HEAD --output /tmp/premerge.json
          cora verify-dev-gate /tmp/premerge.json --repo .
          python -c 'import json; r=json.load(open("/tmp/premerge.json")); assert r["authorization"]=="NONE" and r["ci_review_attestation"]=="NOT_VERIFIED_BY_OFFLINE_CORA"; assert r["status"] in ("OBSERVED_REVIEW_REQUIRED","BOOTSTRAP_REVIEW_REQUIRED")'
      - name: Deterministic governance stress and independent finite oracle
        run: |
          cora stress-continuous --seed 883 --cases 1000000 --output /tmp/gov-a.json
          cora stress-continuous --seed 883 --cases 1000000 --output /tmp/gov-b.json
          cmp /tmp/gov-a.json /tmp/gov-b.json
          python -c 'import json; x=json.load(open("/tmp/gov-a.json")); assert x["cases"]==1000000 and x["mismatches"]==0 and x["distinct_input_masks"]==1000000'
      - name: Preserve premerge receipt and seed reproducibility samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-premerge-python-${{ matrix.python-version }}-review-only
          path: |
            /tmp/premerge.json
            /tmp/cora-workflow-plan.json
            /tmp/cora-method-case.json
            /tmp/cora-method-questions.json
            /tmp/gov-a.json
            /tmp/gov-b.json
          if-no-files-found: warn
          retention-days: 14
  postmerge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install .
      - name: Post-merge change and debt signal drift
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if [[ "$PREVIOUS_SHA" =~ ^0+$ ]]; then echo 'No previous push commit; unable to attest change baseline'; exit 1; fi
          cora dev-postmerge . --previous "$PREVIOUS_SHA" --head HEAD --with-debt --output /tmp/postmerge.json
          cora verify-dev-gate /tmp/postmerge.json --repo .
          python -c 'import json; x=json.load(open("/tmp/postmerge.json")); assert x["authorization"]=="NONE" and x["phase"]=="postmerge"; assert "DEBT_COMPARISON_UNAVAILABLE" not in x["blockers"]'
      - name: Preserve postmerge debt and source review receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-postmerge-review-only
          path: /tmp/postmerge.json
          if-no-files-found: warn
          retention-days: 30
