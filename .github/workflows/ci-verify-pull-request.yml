name: CI | Verify pull request
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install and verify
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          cora version
      - name: Verify deterministic mutation corpus
        run: |
          cora stress --cases 1000000 --seed 883 --output /tmp/mutation.json
          python -c 'import json; x=json.load(open("/tmp/mutation.json")); assert x["cases"]==1000000 and x["mismatches"]==0'
