name: CI | Verify pull request
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install and verify
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          cora version
      - name: Verify immutable Git snapshot and ledger
        run: |
          cora snapshot . --revision HEAD --output /tmp/cora-ledger.json
          cora verify-ledger /tmp/cora-ledger.json --repo .
      - name: Verify legacy mutation corpus
        run: |
          cora stress --cases 1000000 --seed 883 --output /tmp/mutation.json
          python -c 'import json; x=json.load(open("/tmp/mutation.json")); assert x["cases"]==1000000 and x["mismatches"]==0'
      - name: Verify new evidence corpus and deterministic replay
        run: |
          cora stress-evidence --cases 1000000 --seed 883 --output /tmp/evidence-a.json
          cora stress-evidence --cases 1000000 --seed 883 --output /tmp/evidence-b.json
          cmp /tmp/evidence-a.json /tmp/evidence-b.json
          python -c 'import json; x=json.load(open("/tmp/evidence-a.json")); assert x["cases"]==1000000 and x["fixture_families"]==24 and x["mismatches"]==0 and x["stream_sha256"]=="8ab8eb008617e11626d3810df508ba295188502ddae7787ae5de7e7eb81506db"'
      - name: Verify explainable graph and deterministic graph mutations
        run: |
          cora stress-graph --seed 883 --cases 1000000 --output /tmp/graph-a.json
          cora stress-graph --seed 883 --cases 1000000 --output /tmp/graph-b.json
          cmp /tmp/graph-a.json /tmp/graph-b.json
          python -c 'import json; x=json.load(open("/tmp/graph-a.json")); assert x["cases"]==1000000 and x["families"]==24 and x["mismatches"]==0 and x["stream_sha256"]=="1f546e22c53a76dfde821013bf1c31e686b12072d79cea0999214027bcb17851"'
      - name: Verify adapter contracts and seeded million-case reproducibility
        run: |
          cora adapter-audit . --revision HEAD --output /tmp/cora-adapters.json
          cora verify-adapters /tmp/cora-adapters.json --repo .
          cora stress-adapters --seed 883 --cases 1000000 --output /tmp/adapters-a.json
          cora stress-adapters --seed 883 --cases 1000000 --output /tmp/adapters-b.json
          cmp /tmp/adapters-a.json /tmp/adapters-b.json
          python -c 'import json; x=json.load(open("/tmp/adapters-a.json")); assert x["cases"]==1000000 and x["families"]==24 and x["distinct_input_fingerprints"]==1000000 and x["mismatches"]==0 and x["stream_sha256"]=="9c35a7451c083577045ba7bfa1627c38d14a6ba76e9869d84fe33e482f05d08b"'

      - name: Verify scoped file lab, governance onboarding and seeded triage
        run: |
          python tools/verify_repository_contract.py --repo .
          cora file-lab . --path src/cora/graph.py --revision HEAD --output /tmp/cora-file-lab.json --prompt-output /tmp/cora-ai-prompt.json
          cora verify-file-lab /tmp/cora-file-lab.json --repo .
          cora stress-file-lab --seed 883 --cases 1000000 --output /tmp/file-lab-a.json
          cora stress-file-lab --seed 883 --cases 1000000 --output /tmp/file-lab-b.json
          cmp /tmp/file-lab-a.json /tmp/file-lab-b.json
          python -c 'import json; x=json.load(open("/tmp/file-lab-a.json")); assert x["cases"]==1000000 and x["distinct_risk_vectors"]==1000000 and x["mismatches"]==0 and x["families"]==24 and x["digest"]=="90525c7ef2419c72b7a2ec7dab268d189de84387edf3551264a241e62e792610"'

      - name: Verify v1.experimental repository identity and role saturation
        run: |
          python tools/verify_repository_contract.py --repo .
          python tools/verify_artifact_roles.py --repo . --output /tmp/cora-self-v1.json
          cora artifact-audit . --revision HEAD --output /tmp/cora-artifacts.json
          cora verify-artifacts /tmp/cora-artifacts.json --repo .
          cora file-lab . --path tests/test_pr10_artifact_roles.py --revision HEAD --output /tmp/cora-role-lab.json
          cora verify-file-lab /tmp/cora-role-lab.json --repo .
          cora stress-artifact-semantics --seed 883 --minimum-cases 1000000 --no-novelty 10000000 --output /tmp/cora-saturation.json
          python -c 'import json; a=json.load(open("/tmp/cora-saturation.json")); assert a["total_cases"]==11000000 and a["semantic_classes_observed"]==12288 and a["new_classes_after_M"]==0 and a["mismatches"]==0 and a["stream_sha256"]=="523cdad1ebd659071a645aedc567de1ceeb65ee5fd0d356c8f17c0c4f5e9844f"'
