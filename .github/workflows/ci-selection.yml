name: CI | Conservative file selection proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install one CORA distribution and test selector
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p test_selection.py -v
          cora select-file . --revision HEAD --path src/cora/selection.py --output /tmp/selection.json
          cora verify-selection /tmp/selection.json --repo .
          python -c 'import json; x=json.load(open("/tmp/selection.json")); assert x["selection"]["authorized_action"]=="NONE" and not x["selection"]["safe_deletion_proven"]'
      - name: Replay one million semantic vectors independently twice
        run: |
          cora stress-selection --seed 883 --cases 1000000 --output /tmp/selection-a.json
          cora stress-selection --seed 883 --cases 1000000 --output /tmp/selection-b.json
          cmp /tmp/selection-a.json /tmp/selection-b.json
          python -c 'import json; x=json.load(open("/tmp/selection-a.json")); assert x["mismatches"]==0 and x["distinct_vectors"]==1000000 and x["distinct_applicable_semantic_signatures"]==536520 and x["stream_sha256"]=="72cec25137dd9928346ee9887ece4f78d9cbb13920d2a8dc210ff7fcde98dc71" and x["authorized_destructive_changes"]==0'
