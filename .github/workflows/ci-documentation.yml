name: CI | CORA documentation source assurance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation-contract:
    name: documentation-contract (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact source SHA
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install candidate CORA
        run: python -m pip install -e .
      - name: Verify documentation inventory and links
        run: python tools/verify_documentation.py --repo .
      - name: Falsify real disposable Markdown and JSON contract mutations
        run: python -m unittest discover -s tests -p 'test_pr21_documentation.py' -v
      - name: Bound S01-S18 README claims to exact Git source and replay proof
        run: |
          python tools/verify_claim_evidence.py --repo . --revision HEAD --output /tmp/cora-doc-proofs.json
          python tools/verify_claim_evidence.py --repo . --revision HEAD --verify-report /tmp/cora-doc-proofs.json
          python -c 'import json; p=json.load(open("/tmp/cora-doc-proofs.json")); assert p["source_status"]=="PASS_SCOPED_SOURCE" and p["source_claim_count"]==18 and p["governed_status"]=="BLOCKED_EXTERNAL" and p["authorization"]=="NONE" and not p["host_review_attested"]'
      - name: Falsify physical Git-committed semantic, source, DoD and CI mutants
        run: python -m unittest discover -s tests -p 'test_pr22_documentation_proofs.py' -v
      - name: Preserve revision-bound source receipts for review only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-doc-proof-python-${{ matrix.python-version }}-source-only
          path: /tmp/cora-doc-proofs.json
          if-no-files-found: warn
          retention-days: 14
      - name: Product / software / repository contracts and roles
        run: |
          python tools/verify_repository_contract.py --repo .
          python tools/verify_artifact_roles.py --repo .
      - name: Legacy repository and release regression
        run: |
          python -m unittest discover -s tests -p 'test_pr08_repository.py' -q
          python -m unittest discover -s tests -p 'test_pr15_release_readiness.py' -q
      - name: Reticular source and governed remain separated
        run: |
          python -c 'import json; from cora.reticulum import ordered_cut; r=json.load(open("cora.documentation-dod.json")); x={n["id"]:n for n in r["nodes"]}; assert len(ordered_cut(r["nodes"],"G_DOC_SOURCE"))==24; assert len(ordered_cut(r["nodes"],"G_DOC_ACCEPTED"))==28; assert r["authority"]=="NONE" and r["external_status"]=="BLOCKED_EXTERNAL"; assert all(x[n]["scope"]=="EXTERNAL" for n in ("E01","E02","E03"))'
