name: CI | CORA documentation source assurance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation-contract:
    name: documentation-contract (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact source SHA
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install candidate CORA
        run: python -m pip install -e .
      - name: Verify documentation inventory and links
        run: python tools/verify_documentation.py --repo .
      - name: Falsify real disposable Markdown and JSON contract mutations
        run: python -m unittest discover -s tests -p 'test_pr21_documentation.py' -v
      - name: Falsify 1,000 bounded editorial and reader-target vectors
        env:
          CORA_NAV_REPORT: /tmp/cora-readme-nav-1000.json
          CORA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p 'test_pr23_navigation.py' -v
          python -c 'import json; r=json.load(open("/tmp/cora-readme-nav-1000.json")); assert r["vectors"]==1000 and r["rejected"]==1000 and r["distinct_input_fingerprints"]==1000 and not r["survivors"] and r["authority"]=="NONE" and r["governed_status"]=="BLOCKED_EXTERNAL"'
      - name: Bound S01-S18 README claims to exact Git source and replay proof
        run: |
          python tools/verify_claim_evidence.py --repo . --revision HEAD --output /tmp/cora-doc-proofs.json
          python tools/verify_claim_evidence.py --repo . --revision HEAD --verify-report /tmp/cora-doc-proofs.json
          python -c 'import json; p=json.load(open("/tmp/cora-doc-proofs.json")); assert p["source_status"]=="PASS_SCOPED_SOURCE" and p["source_claim_count"]==18 and p["governed_status"]=="BLOCKED_EXTERNAL" and p["authorization"]=="NONE" and not p["host_review_attested"]'
      - name: Falsify physical Git-committed semantic, source, DoD and CI mutants
        run: python -m unittest discover -s tests -p 'test_pr22_documentation_proofs.py' -v
      - name: PR33 independent PR26 Git fixture repeatability samples
        run: |
          python -m cora.ci_repro --repo . --sha "$(git rev-parse HEAD)" --repetitions 3 --group PR26_CAPABILITY_MUTANTS --output /tmp/cora-pr33-capability-repeats.json
      - name: Qualify all CLI capability bindings and falsify committed mutants
        run: |
          python tools/verify_capability_atlas.py --repo . --revision HEAD --output /tmp/cora-capabilities.json
          python tools/verify_capability_atlas.py --repo . --verify-report /tmp/cora-capabilities.json
          python -m unittest discover -s tests -p 'test_pr26_capability_atlas.py' -v
          python -c 'import json; x=json.load(open("/tmp/cora-capabilities.json")); assert x["command_count"]==71 and x["family_count"]==8 and x["governed_status"]=="BLOCKED_EXTERNAL" and x["authorization"]=="NONE" and all(c["test_execution"]=="NOT_ATTESTED_BY_SOURCE" for c in x["commands"])'
      - name: PR31 integrated HTML/AI atlas and negative original-Git maturity falsifiers
        run: |
          python -m unittest discover -s tests -p 'test_pr31_maturity_atlas.py' -v
          BASE=$(git rev-parse HEAD^)
          cora method-synthesize . --synergic --revision HEAD --base-sha "$BASE" --output /tmp/cora-pr31-source.json --atlas-json /tmp/cora-pr31-atlas.json --atlas-html /tmp/cora-pr31-atlas.html --ai-request-output /tmp/cora-pr31-ai.json
          cora verify-method-synthesis /tmp/cora-pr31-source.json --repo . --synergic --atlas-json /tmp/cora-pr31-atlas.json --atlas-html /tmp/cora-pr31-atlas.html
          python -c 'import json; a=json.load(open("/tmp/cora-pr31-atlas.json")); assert len(a["capabilities"])==71 and len(a["procedures"])==14 and len(a["maturity"]["gates"])==6 and a["maturity"]["assessment"]["status"]=="BLOCKED_EXTERNAL" and a["lineage"]["independent_corroborations"]==0 and a["authorization"]=="NONE"'

      - name: Verify typed object/standards source lattice and real-CORA negative mutants
        run: |
          test -d .git
          python tools/verify_type_assurance.py --repo . --revision HEAD > /tmp/cora-type-assurance.json
          python -m unittest discover -s tests -p 'test_pr27_type_assurance.py' -v
          python -c 'import json; r=json.load(open("/tmp/cora-type-assurance.json")); assert r["result"]=="PASS_SCOPED_STRUCTURAL_MODEL" and r["type_count"]==20 and r["plane_count"]==7 and r["upstream_method_count"]==14 and r["reference_count"]==10 and r["code_durability_count"]==12 and r["formal_standard_count"]==3 and r["authorization"]=="NONE" and r["external"]=="BLOCKED_EXTERNAL" and r["universal_completeness"]=="UNSUPPORTED"'
      - name: Integrated semantic service, real original-source adversarial cases and replay
        run: |
          test -d .git
          cora method-synthesize . --integrated --revision HEAD --output /tmp/cora-integrated.json --ai-request-output /tmp/cora-integrated-ai-request.json
          cora verify-method-synthesis /tmp/cora-integrated.json --repo . --integrated
          python -m unittest discover -s tests -p 'test_pr28_integrated_service.py' -v
          python -c 'import json; r=json.load(open("/tmp/cora-integrated.json")); q=json.load(open("/tmp/cora-integrated-ai-request.json")); assert r["features"]["available_parser_commands"]==71 and r["methods"]["count"]==14 and len(r["dimensions"])==12 and r["claim_to_implementation"]["count"]==18 and len(r["semantic_crosswalk"])==20 and r["reticulum"]["full_status"]=="BLOCKED_EXTERNAL" and not r["features"]["all_behaviors_tested"] and r["authorization"]=="NONE" and q["provider_invoked"] is False and q["authority"]=="NONE"'
      - name: Ten million bounded reticular semantic fault cases
        run: |
          cora stress-convergence --integrated --require-full --output /tmp/cora-integrated-10m.json
          cora stress-convergence --integrated --require-full --output /tmp/cora-integrated-10m-replay.json
          cmp /tmp/cora-integrated-10m.json /tmp/cora-integrated-10m-replay.json
          python -c 'import json; r=json.load(open("/tmp/cora-integrated-10m.json")); assert r["status"]=="PASS_SCOPED_FINITE_MODEL" and r["cases"]==10000000 and len(r["families"])==32 and r["positive"]==625000 and r["negative"]==9375000 and r["mismatches"]==0 and r["unsafe_promotions"]==0 and r["physical_source_mutants"]==0 and r["review"]=="BLOCKED_EXTERNAL" and r["product"]=="BLOCKED_EXTERNAL"'
      - name: Reconcile five synergic DoD goals against real original CORA source
        run: |
          test -d .git
          BASE="$(git rev-parse HEAD^)"
          cora method-synthesize . --synergic --revision HEAD --base-sha "$BASE" --execute-source-probes --output /tmp/cora-five-goals.json --ai-request-output /tmp/cora-five-ai-plan.json
          cora verify-method-synthesis /tmp/cora-five-goals.json --repo . --synergic
          python -m unittest discover -s tests -p 'test_pr29_five_synergies.py' -v
          python -c 'import json; x=json.load(open("/tmp/cora-five-goals.json")); assert x["method_counts"]=={"commands":71,"families":8,"original_methods":14,"object_types":20,"abstraction_dimensions":12} and x["truth"]["verified_semantic_claims"]==0 and len(x["truth"]["claims"])==18 and x["behavior"]["source_probes_passed"]==3 and x["goals"]["G_UNIFIED"]=="SOURCE_CANDIDATE_NOT_PRODUCT_READY" and x["goals"]["G_GOVERNED"]=="BLOCKED_EXTERNAL" and x["reticulum"]["nodes"]==29 and x["authorization"]=="NONE" and not x["all_71_behaviors_proven"]'
      - name: Falsify one million preseeded semantic cases twice on exact Git HEAD
        run: |
          cora stress-convergence --synergic --repo . --revision HEAD --sessions 10 --cases-per-session 100000 --require-full --output /tmp/cora-five-million.json
          cora stress-convergence --synergic --repo . --revision HEAD --sessions 10 --cases-per-session 100000 --require-full --output /tmp/cora-five-million-replay.json
          cmp /tmp/cora-five-million.json /tmp/cora-five-million-replay.json
          python -c 'import json; x=json.load(open("/tmp/cora-five-million.json")); assert x["state"]=="PASS_SCOPED_SEEDED_MODEL" and x["cases"]==1000000 and x["families"]==32 and x["positive_controls"]==62500 and x["negative_scenarios"]==937500 and x["oracle_disagreements"]==0 and x["unauthorized_promotions"]==0 and x["physical_source_mutations"]==0 and x["external_status"]=="BLOCKED_EXTERNAL" and not x["product_ready"]'
      - name: Qualify lossless root simplification and archival source DoD
        run: |
          python tools/verify_layout_simplification.py --repo . --revision HEAD --output /tmp/cora-layout-proof.json
          python tools/verify_layout_simplification.py --repo . --revision HEAD --replay /tmp/cora-layout-proof.json > /tmp/cora-layout-replayed.json
          python -m unittest discover -s tests -p 'test_pr30_layout_simplification.py' -v
          python -c 'import json; x=json.load(open("/tmp/cora-layout-proof.json")); assert x["root_before"]==25 and x["root_after"]==11 and x["remaining_root_cora_json"]==2 and x["internal_contract_blobs_preserved"]==2 and x["thematic_byte_identical"]==8 and x["thematic_structural_rewrites"]==3 and x["top_level_docs_removed"]==14 and x["historical_blobs_preserved"]==14 and x["historical_records"]==17 and x["registered_markdown"]==48 and x["cli_commands"]==71 and x["dod"]["nodes"]==23 and x["authorization"]=="NONE" and x["safe_deletion"]=="NOT_AUTHORIZED"'
      - name: Falsify ten thousand preseeded layout semantic cases twice
        run: |
          python tools/verify_layout_simplification.py --repo . --revision HEAD --stress --cases 10000 --seed 883 --output /tmp/cora-layout-stress.json
          python tools/verify_layout_simplification.py --repo . --revision HEAD --stress --cases 10000 --seed 883 --output /tmp/cora-layout-stress-replay.json
          cmp /tmp/cora-layout-stress.json /tmp/cora-layout-stress-replay.json
          python -c 'import json; x=json.load(open("/tmp/cora-layout-stress.json")); assert x["status"]=="PASS_SCOPED_PRESEEDED_FINITE_MODEL" and x["cases"]==10000 and x["families"]==32 and x["positive_controls"]==626 and x["negative_scenarios"]==9374 and x["oracle_disagreements"]==0 and x["unauthorized_promotions"]==0 and x["actual_git_source_mutants"]==0 and x["external"]=="BLOCKED_EXTERNAL" and x["authorization"]=="NONE"'
      - name: PR36 execute original Git one-run methods and render JSON/HTML
        run: |
          cora process-run . --revision HEAD --process full --one-run --output /tmp/cora-one-run.json --atlas-json /tmp/cora-one-run-atlas.json --atlas-html /tmp/cora-one-run.html --model-stress-cases 100000
          python -c 'import json; a=json.load(open("/tmp/cora-one-run.json")); assert len(a["activities"])==8 and a["catalog_commands_declared"]==71 and a["catalog_commands_executed_individually"]==0 and a["runtime_status"]=="NOT_RUN" and a["model_stress"]["cases"]==100000 and a["model_stress"]["oracle_disagreements"]==0 and a["dod"]["nodes"]==27 and a["global_status"]=="BLOCKED_EXTERNAL" and a["authorization"]=="NONE" and not a["release_authorized"]'
      - name: PR36 replay underlying deterministic original source-process receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cora.one_run import _plain_receipt
          from cora.process_suite import verify_suite
          data=json.load(open("/tmp/cora-one-run.json"))
          assert verify_suite(Path("."), _plain_receipt(data["source_process"]))
          PY
      - name: PR36 verify one-run JSON original source identity and report integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cora.one_run import verify_one
          data=json.load(open("/tmp/cora-one-run.json"))
          assert verify_one(Path("."), data)
          PY
      - name: PR36 assert offline HTML byte-equivalence to verified run
        run: |
          cora verify-process /tmp/cora-one-run.json --repo . --one-run --atlas-json /tmp/cora-one-run-atlas.json --atlas-html /tmp/cora-one-run.html
      - name: PR36 physical Git DoD mutants and one-run negative tests
        run: |
          python -m unittest discover -s tests -p 'test_pr36_one_run.py' -v
      - name: PR36 falsify 100k distinct preseeded semantic receipts twice
        run: |
          python -m cora.one_run_stress --cases 100000 --seed 883 --output /tmp/cora-one-run-100k.json
          python -m cora.one_run_stress --cases 100000 --seed 883 --output /tmp/cora-one-run-100k-replay.json
          cmp /tmp/cora-one-run-100k.json /tmp/cora-one-run-100k-replay.json
          python -c 'import json; r=json.load(open("/tmp/cora-one-run-100k.json")); assert r["status"]=="PASS_SCOPED_PRESEEDED_FINITE_MODEL" and r["cases"]==100000 and r["families"]==32 and r["positive_controls"]==6250 and r["negative_scenarios"]==93750 and r["distinct_input_fingerprints"]==100000 and r["oracle_disagreements"]==0 and r["unauthorized_promotions"]==0 and r["physical_source_mutants"]==0 and r["external"]=="BLOCKED_EXTERNAL" and r["authority"]=="NONE"'
      - name: Preserve revision-bound source receipts for review only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cora-doc-proof-python-${{ matrix.python-version }}-source-only
          path: |
            /tmp/cora-doc-proofs.json
            /tmp/cora-readme-nav-1000.json
            /tmp/cora-capabilities.json
            /tmp/cora-type-assurance.json
            /tmp/cora-integrated.json
            /tmp/cora-integrated-ai-request.json
            /tmp/cora-integrated-10m.json
            /tmp/cora-integrated-10m-replay.json
            /tmp/cora-five-goals.json
            /tmp/cora-five-ai-plan.json
            /tmp/cora-pr33-capability-repeats.json
            /tmp/cora-pr31-source.json
            /tmp/cora-pr31-atlas.json
            /tmp/cora-pr31-atlas.html
            /tmp/cora-one-run.json
            /tmp/cora-one-run-atlas.json
            /tmp/cora-one-run.html
            /tmp/cora-one-run-100k.json
            /tmp/cora-one-run-100k-replay.json
            /tmp/cora-pr31-ai.json
            /tmp/cora-five-million.json
            /tmp/cora-five-million-replay.json
            /tmp/cora-layout-proof.json
            /tmp/cora-layout-replayed.json
            /tmp/cora-layout-stress.json
            /tmp/cora-layout-stress-replay.json
          if-no-files-found: warn
          retention-days: 14
      - name: Product / software / repository contracts and roles
        run: |
          python tools/verify_repository_contract.py --repo .
          python tools/verify_artifact_roles.py --repo .
      - name: Legacy repository and release regression
        run: |
          python -m unittest discover -s tests -p 'test_pr08_repository.py' -q
          python -m unittest discover -s tests -p 'test_pr15_release_readiness.py' -q
      - name: Reticular source and governed remain separated
        run: |
          python -c 'import json; from cora.reticulum import ordered_cut; r=json.load(open(".cora/contracts/dod/documentation-dod.json")); x={n["id"]:n for n in r["nodes"]}; assert len(ordered_cut(r["nodes"],"G_DOC_SOURCE"))==24; assert len(ordered_cut(r["nodes"],"G_DOC_ACCEPTED"))==28; assert r["authority"]=="NONE" and r["external_status"]=="BLOCKED_EXTERNAL"; assert all(x[n]["scope"]=="EXTERNAL" for n in ("E01","E02","E03"))'
